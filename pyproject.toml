[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ring-buffer-socket-kernel-inspector"
version = "1.0.0"
description = "Ring Buffer Socket Kernel Inspector"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "TechieGoku2623"}]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "black==24.8.0",
    "flake8==7.1.1",
]

[project.scripts]
ring-buffer-socket-kernel-inspector = "ring_buffer_socket_kernel_inspector.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py312"]
